neobank:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "md:neobank?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
      schema: main
      threads: 4

    ci:
      type: duckdb
      path: "md:neobank_ci?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
      schema: main
      threads: 4