services:
  lightdash:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PLAYGROUND_DATA_DIR=/usr/app/data
      - LIGHTDASH_SECRET=my_super_secret_key_123
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=lightdash
      - DBT_PROJECT_DIR=/usr/app/dbt
      - DBT_PROFILES_DIR=/home/node/.dbt
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://localhost:9000
      - S3_BUCKET=lightdash-files
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_FORCE_PATH_STYLE=true
      - PRE_AGGREGATES_ENABLED=false
    volumes:
      - ../dbt_project:/usr/app/dbt
      - ../data/processed:/usr/app/data
      - ../dbt_project/profiles.yml:/home/node/.dbt/profiles.yml
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lightdash
    volumes:
      - lightdash_db:/var/lib/postgresql/data

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DEFAULT_BUCKETS=lightdash-files
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  lightdash_db:
  minio_data: